# The website on every push and pull request: type check, the tests against a freshly migrated Postgres (the database
# tests need one: they check real SQL, never a mock), and a production build without secrets, the way Railway builds it.
# GitHub emails the person who pushed when a run fails (house rule 15: someone gets told).
name: Website

on:
  push:
    branches: [master]
    paths-ignore: ["apps/mobile/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["apps/mobile/**", "docs/**", "*.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: meitheal
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/meitheal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4" # what Railway runs (RAILPACK_NODE_VERSION)
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: DATABASE_URL=$TEST_DATABASE_URL node scripts/migrate.mjs
      - run: npm test
      - run: npx next build
        env:
          NODE_ENV: production
