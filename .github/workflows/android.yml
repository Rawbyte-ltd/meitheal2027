# Builds the phone app for Android on a GitHub runner: a release build signed with the steady test key held in the
# repository secrets (ANDROID_TEST_KEYSTORE_B64, _PASSWORD, _KEY_ALIAS; the file itself is in ~/.meitheal on Steven's
# phone), so each build installs over the last. Fine for testers, not for the Play Store. Run it from the Actions tab
# or `gh workflow run android.yml`; the .apk is the run's artifact (`gh run download`).
name: Android test build

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Test signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "no ANDROID_TEST_KEYSTORE_B64 secret: the build would get a throwaway key"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/test.p12
          printf 'storeFile=app/test.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Meitheal-2027-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
